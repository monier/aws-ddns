# aws-ddns — deployment on a local server (as a Docker Compose project).
#
# TEMPLATE: the image reference is rendered in by the root Makefile —
#   make deploy        → dist/docker-compose.registry.yaml  (ghcr.io registry image)
#   make export-image  → dist/docker-compose.yaml           (offline archive image)
# Deploy a rendered copy, not this file.
#
# REGISTRY MODE (make deploy): the server pulls the image from the public
# registry — nothing to copy; platform "update"/pull actions work. Pin the
# version tag for reproducibility, or use :latest for button-driven upgrades.
#
# OFFLINE MODE (make export-image): self-contained, no registry. ONCE per
# version, load the matching archive first: docker load -i <archive>. The
# archive restores the image as localhost/aws-ddns:<version> — exactly the
# rendered name; platform "update"/pull actions cannot work in this mode
# (nothing to pull from — they fail harmlessly); upgrade by re-deploying this
# project with the new rendered file.
#
# Put your filled-in aws-ddns.ini in the host data folder mounted below; the
# app writes its last-ip.txt state file next to it. No user id is set anywhere —
# the container engine manages the user (Docker's default unless your platform
# overrides it), so the folder needs no ownership preparation.

services:
  aws-ddns:
    image: __IMAGE__
    container_name: aws-ddns
    restart: unless-stopped
    # Headless daemon: no inbound port is ever published; outbound HTTPS only.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: bridge
    volumes:
      # >>> EDIT the host path to your server data folder. <<<
      - /srv/aws-ddns:/var/lib/aws-ddns
